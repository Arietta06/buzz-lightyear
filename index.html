<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz Lightyear :: Retro Quiz Buzzer</title>
    <!-- 引入复古像素字体 Pixelify Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        /* 核心复古样式库 */
        :root {
            --pixel-font: 'Pixelify Sans', sans-serif;
            
            /* 配色方案：白、绿、蓝、黑 */
            --bg-color: #fcfcfc;        /* 纯白 */
            --text-main: #111111;       /* 黑色 */
            --border-color: #111111;    /* 黑色粗边框 */
            
            /* 复古蓝绿 */
            --arcade-green: #5cb85c;   /* 复古绿 */
            --arcade-green-hover: #4cae4c; 
            --arcade-blue: #337ab7;    /* 复古蓝 */
            --arcade-blue-hover: #2e6da4;
            --arcade-red: #d9534f;     /* 复古红 (用于清除和重置) */
            --arcade-red-hover: #c9302c;
            
            /* 像素风格阴影 */
            --pixel-shadow: 4px 4px 0px #111111;
            --pixel-button-push: translate(2px, 2px);
            --pixel-shadow-pushed: 2px 2px 0px #111111;
        }

        * {
            box-sizing: border-box;
            font-family: var(--pixel-font);
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            /* 增加复古背景网格纹理 */
            background-image: 
                linear-gradient(90deg, #f0f0f0 1px, transparent 1px),
                linear-gradient(#f0f0f0 1px, transparent 1px);
            background-size: 10px 10px;
        }

        /* 核心像素卡片样式 */
        .arcade-card {
            background: #FFFFFF;
            border: 4px solid var(--border-color);
            border-radius: 0; /* 必须是直角 */
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--pixel-shadow);
            margin: 1rem;
        }

        /* 像素输入框样式 */
        .arcade-input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 3px solid var(--border-color);
            border-radius: 0;
            background-color: #FFFFFF;
            color: var(--text-main);
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.2s;
        }
        
        .arcade-input:focus {
            outline: none;
            border-color: var(--arcade-blue);
            background-color: #fafaff;
        }

        /* 复古按钮基础样式 (Arcade Button) */
        .arcade-btn {
            display: inline-block;
            width: 100%;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            border: 4px solid var(--border-color);
            border-radius: 0;
            transition: all 0.1s;
            position: relative;
            box-shadow: var(--pixel-shadow);
            -webkit-appearance: none; /* 移除 iOS 样式 */
        }
        
        /* 按钮按下时的 3D 效果 */
        .arcade-btn:active {
            transform: var(--pixel-button-push);
            box-shadow: var(--pixel-shadow-pushed);
        }

        /* 复古蓝按钮 */
        .arcade-btn-blue {
            background-color: var(--arcade-blue);
        }
        .arcade-btn-blue:hover {
            background-color: var(--arcade-blue-hover);
        }

        /* 复古绿按钮 */
        .arcade-btn-green {
            background-color: var(--arcade-green);
        }
        .arcade-btn-green:hover {
            background-color: var(--arcade-green-hover);
        }
        
        /* 复古红按钮 (用于危险操作) */
        .arcade-btn-red {
            background-color: var(--arcade-red);
        }
        .arcade-btn-red:hover {
            background-color: var(--arcade-red-hover);
        }

        /* 复古标题 */
        h1.game-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--text-main);
            text-shadow: 2px 2px 0px #555, 4px 4px 0px #aaa;
            letter-spacing: 2px;
        }
        
        h2.game-heading {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        p.game-subtitle {
            font-size: 1rem;
            margin-bottom: 1rem;
            opacity: 0.7;
        }

        #screen-login, #screen-host, #screen-player { display: none; }
        .active-screen { display: block !important; }

        /* 抢答画面专属样式 */
        #answer-area, #buzzer-area {
            display: none;
            margin-top: 1.5rem;
        }
        
        .active-answer { display: block !important; }

        /* 复古玩家列表 (Host) */
        #player-list {
            margin-top: 2rem;
            text-align: left;
            padding: 0 1rem;
        }
        
        .list-title {
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .player-item {
            font-size: 1rem;
            padding: 0.5rem;
            color: var(--text-main);
            border-bottom: 1px dotted #ccc;
        }
        
        .player-item:before {
            content: ">> ";
            color: var(--arcade-green);
        }

    </style>
</head>
<body>
    
    <!-- 1. 登录/加入界面 -->
    <div id="screen-login" class="arcade-card active-screen">
        <h1 class="game-title">BUZZ LIGHTYEAR</h1>
        <p class="game-subtitle">:: START ::</p>
        <input type="text" id="room" placeholder="Enter Room Code (4 chars)" maxlength="4" class="arcade-input">
        <input type="password" id="password" placeholder="Enter Security Code (4 chars)" maxlength="4" class="arcade-input">
        
        <button id="btn-create" class="arcade-btn arcade-btn-blue">Create New Room</button>
        <div style="margin: 1rem 0; font-size: 0.9rem; opacity: 0.6;">-- OR --</div>
        <input type="text" id="player-name" placeholder="Enter Your Name" maxlength="15" class="arcade-input">
        <button id="btn-join" class="arcade-btn arcade-btn-green">Join as Player</button>
    </div>

    <!-- 2. 主持人界面 (Host) -->
    <div id="screen-host" class="arcade-card">
        <h2 class="game-heading">HOST DASHBOARD</h2>
        <p id="host-info" style="font-size: 1.1rem; margin-bottom: 1.5rem; font-weight:700;">
            Room: <span id="host-room-display" style="color:var(--arcade-blue);">....</span>
        </p>
        
        <div id="answer-area">
            <h3 class="game-heading" style="color:var(--arcade-blue);">>> PLAYER ANSWERING <<</h3>
            <p id="current-answer-player" style="font-size: 1.8rem; font-weight:700; background:#eee; color:#111; border: 3px solid #111; padding: 1rem 0; box-shadow: 2px 2px 0 #111;">...</p>
            <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                <button id="btn-correct" class="arcade-btn arcade-btn-green">CORRECT</button>
                <button id="btn-incorrect" class="arcade-btn arcade-btn-red">INCORRECT</button>
            </div>
        </div>
        
        <button id="btn-reset" class="arcade-btn arcade-btn-blue" style="margin-top:2rem;">Reset All Buzzers</button>
        <button id="btn-clear-confetti" class="arcade-btn arcade-btn-red" style="font-size:1rem; margin-top:10px;">Clear Winners</button>

        <div id="player-list">
            <h3 class="list-title">Online Players</h3>
            <div id="player-list-content"></div>
        </div>
    </div>

    <!-- 3. 玩家抢答界面 (Player) -->
    <div id="screen-player" class="arcade-card">
        <h2 class="game-heading">QUIZ buzzy</h2>
        <p id="player-info" style="margin-bottom:1rem; font-size:1.1rem; font-weight:700;">
            Room: <span id="player-room-display" style="color:var(--arcade-blue);">....</span> | 
            As: <span id="player-name-display" style="color:var(--arcade-green);">....</span>
        </p>
        <div id="buzzer-area">
            <h3 class="game-heading">:: Get Ready ::</h3>
            <button id="btn-buzz" class="arcade-btn arcade-btn-green" style="font-size:1.8rem; padding: 1.5rem; text-shadow:1px 1px 0 #111;">BUZZ</button>
            <p style="margin-top:1rem; font-size:1rem; color:var(--arcade-red); font-weight:700;">PUSH TO ANSWER!</p>
        </div>
        <p id="player-status" style="display:none; margin-top:1.5rem; font-size:1.2rem; background:#eee; padding: 1rem; border:2px solid #111;">Waiting for Host...</p>
    </div>

    <script>
        // ==========================================
        // #⚠️ 1. 请把这里换成你的真实 Render 网址！！！
        // 例如: https://buzz-lightyear-backend.onrender.com
        // ==========================================
        const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
          ? 'http://localhost:3000' 
          : 'https://buzz-lightyear-backend.onrender.com'; // &lt;-- 必换！

        const socket = io(BACKEND_URL);

        // ... 后续所有逻辑与昨天完全一致，无需修改 ...
        const uiControl = {
            screenLogin: document.getElementById('screen-login'),
            screenHost: document.getElementById('screen-host'),
            screenPlayer: document.getElementById('screen-player'),
            answerArea: document.getElementById('answer-area'),
            buzzerArea: document.getElementById('buzzer-area'),
            showScreen(screen) {
                [this.screenLogin, this.screenHost, this.screenPlayer].forEach(s => s.classList.remove('active-screen'));
                screen.classList.add('active-screen');
            },
            updateStatus(msg) {
                const status = document.getElementById('player-status');
                if (msg) {
                    status.textContent = msg;
                    status.style.display = 'block';
                } else {
                    status.style.display = 'none';
                }
            }
        };
        const audios = {
            buzz: new Audio('https://www.myinstants.com/media/sounds/buzz-in.mp3'),
            winner: new Audio('https://www.myinstants.com/media/sounds/ta-da_9.mp3')
        };
        audios.buzz.volume = audios.winner.volume = 0.5;

        socket.on('connect', () => console.log('✅ 8-Bit Buzz Link ESTABLISHED'));
        socket.on('roomError', msg => alert('❌ ERROR: ' + msg));

        // Create
        document.getElementById('btn-create').onclick = () => {
            const room = document.getElementById('room').value.trim();
            const password = document.getElementById('password').value.trim();
            if (room.length === 4 && password.length === 4) {
                socket.emit('createRoom', { room, password });
            } else { alert('Room/Code must be 4 digits!'); }
        };
        socket.on('roomCreated', room => {
            uiControl.showScreen(uiControl.screenHost);
            document.getElementById('host-room-display').textContent = room;
            document.getElementById('host-info').style.display = 'block';
        });

        // Join
        document.getElementById('btn-join').onclick = () => {
            const room = document.getElementById('room').value.trim();
            const playerName = document.getElementById('player-name').value.trim();
            if (room.length === 4 && playerName) {
                socket.emit('joinRoom', { room, playerName });
            } else { alert('Room Code (4 chars) and Name required!'); }
        };
        socket.on('roomJoined', roomData => {
            uiControl.showScreen(uiControl.screenPlayer);
            document.getElementById('player-room-display').textContent = roomData.room;
            document.getElementById('player-name-display').textContent = roomData.playerName;
            document.getElementById('player-info').style.display = 'block';
            
            uiControl.buzzerArea.style.display = roomData.hostResetted ? 'block' : 'none';
            uiControl.updateStatus(roomData.hostResetted ? '' : 'Waiting for Host...');
        });

        // Host Player List
        socket.on('playerListUpdate', (players) => {
            const playerListContent = document.getElementById('player-list-content');
            playerListContent.innerHTML = '';
            players.forEach(p => {
                const pItem = document.createElement('div');
                pItem.className = 'player-item';
                pItem.textContent = p;
                playerListContent.appendChild(pItem);
            });
        });

        // Buzz
        document.getElementById('btn-buzz').onclick = () => {
            const room = document.getElementById('player-room-display').textContent;
            socket.emit('buzz', room);
        };
        socket.on('playerAnswered', data => {
            audios.buzz.play();
            // Player side
            if(document.getElementById('screen-player').classList.contains('active-screen')) {
                uiControl.buzzerArea.style.display = 'none';
                uiControl.updateStatus(`Player ${data.playerName} is answering...`);
            }
            // Host side
            if(document.getElementById('screen-host').classList.contains('active-screen')) {
                document.getElementById('current-answer-player').textContent = data.playerName;
                uiControl.answerArea.style.display = 'block';
                document.getElementById('btn-reset').style.display = 'none';
            }
        });

        // Host Judge
        document.getElementById('btn-correct').onclick = () => {
            const room = document.getElementById('host-room-display').textContent;
            const playerName = document.getElementById('current-answer-player').textContent;
            socket.emit('judgeAnswer', { room, playerName, result: 'correct' });
        };
        document.getElementById('btn-incorrect').onclick = () => {
            const room = document.getElementById('host-room-display').textContent;
            const playerName = document.getElementById('current-answer-player').textContent;
            socket.emit('judgeAnswer', { room, playerName, result: 'incorrect' });
        };
        socket.on('answerJudged', data => {
            uiControl.answerArea.style.display = 'none';
            // Host reset logic is now separate
            if(document.getElementById('screen-host').classList.contains('active-screen')) {
                 document.getElementById('btn-reset').style.display = 'block';
            }

            if (data.result === 'correct') {
                audios.winner.play();
                // 复古蓝绿白 Confetti，只洒一下
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#FFFFFF', '#337ab7', '#5cb85c'] // 白蓝绿
                });
                if(document.getElementById('screen-player').classList.contains('active-screen')) {
                    uiControl.updateStatus(`[CORRECT] Player ${data.playerName} wins this round!`);
                }
            } else {
                if(document.getElementById('screen-player').classList.contains('active-screen')) {
                    uiControl.updateStatus(`[INCORRECT] Player ${data.playerName} answer wrong.`);
                }
            }
        });

        // Host Reset
        document.getElementById('btn-reset').onclick = () => {
            const room = document.getElementById('host-room-display').textContent;
            socket.emit('resetBuzzers', room);
        };
        socket.on('buzzersResetted', () => {
            // Player side
            if(document.getElementById('screen-player').classList.contains('active-screen')) {
                uiControl.updateStatus('');
                uiControl.buzzerArea.style.display = 'block';
            }
        });

        // Host Clear Winners (Optional)
        document.getElementById('btn-clear-confetti').onclick = () => {
             confetti.reset();
        };

    </script>
</body>
</html>
